name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Build, validate models, run tests
        run: gradle build

      - name: Verify generated AsyncAPI documents match the committed golden files
        run: |
          diff -ru examples/kafka/expected examples/kafka/build/smithyprojections/kafka/source/asyncapi
          diff -ru examples/redis/expected examples/redis/build/smithyprojections/redis/source/asyncapi
